server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Prevent nginx from setting its own port when receiving queries from various port.
    absolute_redirect off;

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # App files live under eva/ (see Dockerfile). Falling back to eva/index.html
    # (not index.html) keeps client-side routes under /eva/... working, and lets
    # nginx's built-in directory redirect turn a bare "/eva" into "/eva/" -
    # including preserving any query string.
    location / {
        try_files $uri $uri/ /eva/index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}